name: CI

on:
  push:
  pull_request:

jobs:
  web:
    name: Engine, SQL and site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      # Engine, SQL, Kafka and the parity check against the committed Flink results.
      - run: npm test
      - run: npm run build

  producer:
    name: Kafka producer
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pipeline/producer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt -r requirements-dev.txt
      # Runs on librdkafka's built-in mock cluster and a mock Schema Registry.
      - run: python -m pytest -q

  flink:
    name: Real Apache Flink ${{ matrix.flink }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        flink: ["1.20.3", "2.3.0"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install apache-flink==${{ matrix.flink }}
      - name: Generate the test events and queries
        run: npm run parity:data
      # The pipeline's job scripts, planned and run by Flink itself.
      - run: python pipeline/flink/check_sql.py
      # Every parity query on real Flink, then the Tideline engine compared row for row.
      # Only on 2.3: Flink 1.20.3 itself gets one query wrong (TUMBLE with an
      # offset skips every other window), see the README.
      - if: matrix.flink == '2.3.0'
        run: python tests/flink/run_flink.py
      - if: matrix.flink == '2.3.0'
        run: npm ci && npm test -- parity
